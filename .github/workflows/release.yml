name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse to run outside a tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne "tag") {
            throw "This workflow builds a release from a tag. Push a v* tag instead of running it from '$env:GITHUB_REF_NAME'."
          }

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install the Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Stamp the tag version into the build
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $four = if ($version -match "^\d+\.\d+\.\d+\.\d+$") { $version } else { "$version.0" }

          $wails = Get-Content wails.json -Raw | ConvertFrom-Json
          $wails.info.productVersion = $version
          $wails | ConvertTo-Json -Depth 8 | Set-Content wails.json -Encoding utf8

          $info = Get-Content build/windows/info.json -Raw | ConvertFrom-Json
          $info.fixed.file_version = $four
          $info.fixed.product_version = $four
          $info | ConvertTo-Json -Depth 8 | Set-Content build/windows/info.json -Encoding utf8

          "Building $version (fixed $four) from $env:GITHUB_REF_NAME"

      - name: Build both architectures
        shell: pwsh
        run: |
          foreach ($arch in "amd64", "arm64") {
            wails build -platform "windows/$arch" -s -m
            if ($LASTEXITCODE -ne 0) { throw "build failed for $arch" }

            $name = "MC-Tunnel-$env:GITHUB_REF_NAME-windows-$arch.exe"
            Copy-Item build/bin/MC-Tunnel.exe $name
            $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding utf8
            Get-ChildItem $name, "$name.sha256" | Select-Object Name, Length
          }

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem "MC-Tunnel-$env:GITHUB_REF_NAME-windows-*" | ForEach-Object { $_.Name }
          gh release create $env:GITHUB_REF_NAME @files `
            --title "MC Tunnel $env:GITHUB_REF_NAME" `
            --notes-from-tag
